# Checks that every Lua file compiles (WoW runs Lua 5.1), on each push and
# pull request. The release workflow runs the same check before packaging,
# so a typo never reaches CurseForge.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      # (Ubuntu's package servers are sometimes unreachable from the runner:
      # retry the downloads, and give up after a few minutes instead of ten)
      - name: Install Lua 5.1
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=5 update || true
          sudo apt-get -o Acquire::Retries=5 install -y lua5.1
      - name: Compile every Lua file
        run: |
          status=0
          for f in $(git ls-files '*.lua'); do
            luac5.1 -p "$f" || status=1
          done
          exit $status
